version: "3.8"

services:
  chronicle-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colosseum-chronicle-daemon
    restart: always
    environment:
      - NODE_ENV=production
      - PROGRAM_ID=RefLecT111111111111111111111111111111111111
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MENTOR_NOTIFICATION_EMAIL=${MENTOR_NOTIFICATION_EMAIL}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"