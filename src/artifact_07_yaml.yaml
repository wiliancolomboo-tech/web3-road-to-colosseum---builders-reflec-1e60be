version: "3.8"

services:
  colosseum-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colosseum-log-daemon
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=ColosLog11111111111111111111111111111111111
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ALERT_EMAIL_RECIPIENT=${ALERT_EMAIL_RECIPIENT}
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Daemon running')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"