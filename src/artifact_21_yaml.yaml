version: "3.8"

services:
  chronicle-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronicle-sentinel-daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - SOLANA_WS_URL=wss://api.mainnet-beta.solana.com
      - PROGRAM_ID=Chrnc1e111111111111111111111111111111111111
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_123456789_enterprise_key
      - MENTOR_DIGEST_EMAIL=judges@colosseum.org
      - SENDER_EMAIL=chronicle@updates.solana-builders.dev
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"