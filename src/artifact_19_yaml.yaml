version: "3.8"

services:
  chronicle-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colosseum_chronicle_relay
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=Chrnc1e111111111111111111111111111111111111
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_123456789abcdef
      - RESEND_TARGET_EMAIL=hackathon-review@colosseum.org
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"