[package]
name = "chronicle_protocol"
version = "0.1.0"
description = "Solana On-Chain Builder Retrospective Protocol for Colosseum Hackathons"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chronicle_protocol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }