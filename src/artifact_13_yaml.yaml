version: "3.8"

services:
  chronicle-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colosseum-chronicle-daemon
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - CHRONICLE_PROGRAM_ID=ChrnyK8tG82vV6GfGk7L29NfR6aFhZtCqEwB8vP3Colo
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=chronicle@colosseum.builders
      - NOTIFICATION_RECIPIENT_EMAIL=${NOTIFICATION_RECIPIENT_EMAIL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"