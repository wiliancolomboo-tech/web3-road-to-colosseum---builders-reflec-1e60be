version: "3.8"

services:
  chronicle-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=Chrono1111111111111111111111111111111111111
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - INVESTOR_NOTIFICATION_EMAIL=${INVESTOR_NOTIFICATION_EMAIL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8080:8080"